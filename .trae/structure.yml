      type: file
      description: Docker 构建文件

# 前端结构
frontend:
  name: Web
  type: directory
  path: web
  children:
    - name: public
      type: directory
      description: 静态资源
    - name: src
      type: directory
      description: 前端源码
      children:
        - name: account
          type: directory
          description: 账户相关组件
        - name: auth
          type: directory
          description: 认证相关组件
        - name: backend
          type: directory
          description: 后端管理组件
        - name: basic
          type: directory
          description: 基础组件
        - name: common
          type: directory
          description: 通用组件
        - name: locales
          type: directory
          description: 国际化文件
        - name: pricing
          type: directory
          description: 定价相关组件
        - name: provider
          type: directory
          description: 提供商相关组件
        - name: table
          type: directory
          description: 表格组件
        - name: App.js
          type: file
          description: 应用主组件
        - name: index.js
          type: file
          description: 前端入口文件

# 后端核心结构
backend:
  name: Backend
  type: directory
  children:
    - name: controllers
      type: directory
      description: 控制器
    - name: object
      type: directory
      description: 核心业务逻辑
    - name: idp
      type: directory
      description: 身份提供商
    - name: authz
      type: directory
      description: 授权相关功能
    - name: routers
      type: directory
      description: 路由配置
    - name: util
      type: directory
      description: 工具函数
    - name: main.go
      type: file
      description: 主入口文件
