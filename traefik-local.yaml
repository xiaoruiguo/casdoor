# Traefik Local Configuration for Casdoor
# Version: 1.0
# Date: 2026-04-27

global:
  checkNewVersion: false
  sendAnonymousUsage: false

entryPoints:
  web:
    address: ":80"

providers:
  file:
    filename: "./traefik-dynamic-local.yaml"
    watch: true

api:
  dashboard: true
  insecure: true

ping: {}

log:
  level: INFO

accessLog: {}
